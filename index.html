<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Five Development • Daily Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .section-header { font-size: 2.1rem; line-height: 2.4rem; font-weight: 700; letter-spacing: -.04em; }
    .dashboard-screen { transition: opacity 400ms ease, transform 400ms ease; }
    .event-row, .task-row { transition: all 0.2s ease; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-200">
  <div class="border-b border-zinc-800 bg-zinc-900/70 backdrop-blur sticky top-0 z-50">
    <div class="max-w-screen-2xl mx-auto px-8 py-5 flex items-center justify-between">
      <div class="flex items-center gap-x-4">
        <div class="flex items-center gap-x-3">
          <div class="w-11 h-11 bg-white rounded-2xl flex items-center justify-center p-1.5 shadow-inner">
            <img src="FD.png" alt="Five Development Logo" class="w-full h-full object-contain">
          </div>
          <div>
            <div class="font-semibold tracking-tight text-2xl">Five Development</div>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-x-8">
        <div class="text-right">
          <div id="live-time" class="font-mono text-4xl font-semibold tracking-tighter"></div>
          <div id="live-date" class="text-xs text-zinc-500 tracking-[1px]"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="max-w-screen-2xl mx-auto px-8 pt-6 pb-12">
    <div class="flex items-end justify-between mb-6">
      <div>
        <div id="screen-title" class="section-header text-white"></div>
        <div class="text-zinc-500 text-sm mt-1 flex items-center gap-x-2">
          <i class="fa-solid fa-sync fa-sm"></i>
          <span>Auto-rotating every 30 seconds • Updates every 10 minutes</span>
        </div>
      </div>
      <div class="flex items-center gap-x-2" id="screen-dots">
        <div onclick="switchToScreen(0)" class="w-3 h-3 rounded-full bg-white cursor-pointer transition-all" data-screen="0"></div>
        <div onclick="switchToScreen(1)" class="w-3 h-3 rounded-full bg-zinc-700 hover:bg-zinc-600 cursor-pointer transition-all" data-screen="1"></div>
        <div onclick="switchToScreen(2)" class="w-3 h-3 rounded-full bg-zinc-700 hover:bg-zinc-600 cursor-pointer transition-all" data-screen="2"></div>
      </div>
    </div>

    <div id="screen-0" class="dashboard-screen">
      <div class="grid grid-cols-1 gap-3" id="calendar-list"></div>
    </div>
    <div id="screen-1" class="dashboard-screen hidden">
      <div class="grid grid-cols-1 gap-3" id="mytasks-list"></div>
    </div>
    <div id="screen-2" class="dashboard-screen hidden">
      <div class="grid grid-cols-1 gap-3" id="buildertrend-list"></div>
    </div>
  </div>

  <script>
    const WEBHOOK_URL = "https://fivedevelopment.app.n8n.cloud/webhook/dashboard-data";

    let currentScreen = 0;
    let rotationInterval = null;
    let dataRefreshInterval = null;
    let dashboardData = { calendarEvents: [], myTasks: [], buildertrendTasks: [] };

    function updateClock() {
      const now = new Date();
      document.getElementById('live-time').textContent = now.toLocaleTimeString('en-US', {
        timeZone: 'America/Chicago', hour: 'numeric', minute: '2-digit', hour12: true
      });
      document.getElementById('live-date').textContent = now.toLocaleDateString('en-US', {
        timeZone: 'America/Chicago', weekday: 'long', month: 'long', day: 'numeric'
      });
    }

    async function fetchData() {
      try {
        const res = await fetch(WEBHOOK_URL);
        if (!res.ok) throw new Error('Webhook error');
        dashboardData = await res.json();
        renderCurrentScreen();
      } catch (err) {
        console.error('Failed to fetch data:', err);
      }
    }
