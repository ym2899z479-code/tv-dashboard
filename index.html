<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Five Development • Daily Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .section-header { font-size: 1.8rem; line-height: 2.1rem; font-weight: 700; letter-spacing: -.04em; }
    .dashboard-screen { transition: opacity 400ms ease; }
    .event-row, .task-row { transition: all 0.2s ease; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen">

  <!-- Top Bar -->
  <div class="border-b border-zinc-800 bg-zinc-900/70 backdrop-blur sticky top-0 z-50">
    <div class="max-w-screen-2xl mx-auto px-8 py-5 flex items-center justify-between">
      <div class="flex items-center gap-x-4">
        <div class="w-11 h-11 bg-white rounded-2xl flex items-center justify-center p-1.5">
          <img src="FD.png" alt="Five Development" class="w-full h-full object-contain">
        </div>
        <div class="font-semibold tracking-tight text-2xl">Five Development</div>
      </div>
      <div id="live-time" class="font-mono text-4xl font-semibold tracking-tighter"></div>
    </div>
  </div>

  <div class="max-w-screen-2xl mx-auto px-8 pt-6 pb-12">
    <div class="flex justify-between items-end mb-6">
      <div id="screen-title" class="section-header text-white"></div>
      <div class="flex gap-x-2" id="screen-dots"></div>
    </div>

    <!-- Calendar -->
    <div id="screen-0" class="dashboard-screen">
      <div class="grid grid-cols-1 gap-3" id="calendar-list"></div>
    </div>
    <!-- My Tasks -->
    <div id="screen-1" class="dashboard-screen hidden">
      <div class="grid grid-cols-1 gap-3" id="mytasks-list"></div>
    </div>
    <!-- BuilderTrend -->
    <div id="screen-2" class="dashboard-screen hidden">
      <div class="grid grid-cols-1 gap-3" id="buildertrend-list"></div>
    </div>
    <!-- Sales Tasks -->
    <div id="screen-3" class="dashboard-screen hidden">
      <div class="grid grid-cols-1 gap-3" id="sales-list"></div>
    </div>
    <!-- Marketing Tasks -->
    <div id="screen-4" class="dashboard-screen hidden">
      <div class="grid grid-cols-1 gap-3" id="marketing-list"></div>
    </div>
    <!-- Goals -->
    <div id="screen-5" class="dashboard-screen hidden">
      <div class="grid grid-cols-[140px_1fr_1fr] gap-x-5 gap-y-2 items-center" id="goals-matrix-container"></div>
    </div>
    <!-- Projections -->
    <div id="screen-6" class="dashboard-screen hidden flex flex-col gap-y-4">
      <!-- Your original Projections HTML here -->
      <div class="grid grid-cols-3 gap-5">
        <div><div class="text-blue-400 font-bold text-xl">Active Jobs</div><div id="projections-active-list" class="grid grid-cols-1 gap-2"></div></div>
        <div><div class="text-zinc-400 font-bold text-xl">Pipeline Prospect</div><div id="projections-pipe-list" class="grid grid-cols-1 gap-2"></div></div>
        <div><div class="text-emerald-400 font-bold text-xl">Leads & Inquiries</div><div id="projections-leads-list" class="grid grid-cols-1 gap-2"></div></div>
      </div>
      <div><div class="text-amber-500 font-bold text-xl">Preparation</div><div id="projections-prep-list" class="grid grid-cols-4 gap-3"></div></div>
    </div>
  </div>

  <script>
    const WEBHOOK_URL = "https://fivedevelopment.app.n8n.cloud/webhook/dashboard-data";
    let currentScreen = 0;
    let dashboardData = { calendarEvents: [], myTasks: [], buildertrendTasks: [], salesTasks: [], marketingTasks: [], goals: {}, projections: {} };

    function updateClock() {
      const now = new Date();
      document.getElementById('live-time').textContent = now.toLocaleTimeString('en-US', { timeZone: 'America/Chicago', hour: 'numeric', minute: '2-digit', hour12: true });
    }

    function fetchData() {
      fetch(WEBHOOK_URL)
        .then(r => r.json())
        .then(raw => {
          // Unwrap n8n wrapper structure
          dashboardData.calendarEvents = raw.calendarEvents?.data || raw.calendarEvents || [];
          dashboardData.myTasks = raw.myTasks?.data || raw.myTasks || [];
          dashboardData.buildertrendTasks = raw.buildertrendTasks?.data || raw.buildertrendTasks || [];
          dashboardData.salesTasks = raw.salesTasks?.data || raw.salesTasks || [];
          dashboardData.marketingTasks = raw.marketingTasks?.data || raw.marketingTasks || [];
          dashboardData.goals = raw.goals || {};
          dashboardData.projections = raw.projections || {};
          renderCurrentScreen();
        })
        .catch(err => console.error(err));
    }

    function renderCalendar() {
      const container = document.getElementById('calendar-list');
      container.innerHTML = '';
      const events = dashboardData.calendarEvents || [];
      if (events.length === 0) {
        container.innerHTML = '<div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-8 text-center">No events scheduled</div>';
        return;
      }
      events.forEach(event => {
        const div = document.createElement('div');
        div.className = 'event-row bg-zinc-900 border border-zinc-800 rounded-3xl px-7 py-5 flex items-center gap-x-5';
        div.innerHTML = `<div class="flex-1"><div class="font-semibold text-2xl">${event.title || 'No title'}</div></div><div class="font-mono text-lg text-zinc-400">${event.timeframe || ''}</div>`;
        container.appendChild(div);
      });
    }

    function renderTasks(listId, tasks) {
      const container = document.getElementById(listId);
      container.innerHTML = '';
      if (!tasks || tasks.length === 0) {
        container.innerHTML = '<div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-8 text-center">All caught up</div>';
        return;
      }
      tasks.forEach(task => {
        const div = document.createElement('div');
        div.className = 'task-row bg-zinc-900 border border-zinc-800 rounded-3xl px-7 py-5 flex items-center justify-between';
        div.innerHTML = `<div class="font-semibold text-2xl">${task.title || 'No title'}</div><div class="text-sm">${task.dueLabel || ''}</div>`;
        container.appendChild(div);
      });
    }

    function renderCurrentScreen() {
      document.querySelectorAll('.dashboard-screen').forEach(s => s.classList.add('hidden'));
      document.getElementById(`screen-${currentScreen}`).classList.remove('hidden');

      const titles = ['Calendar', 'My Tasks', 'BuilderTrend Tasks', 'Sales Tasks', 'Marketing Tasks', 'Goals', 'Projections'];
      document.getElementById('screen-title').textContent = titles[currentScreen];

      if (currentScreen === 0) renderCalendar();
      if (currentScreen === 1) renderTasks('mytasks-list', dashboardData.myTasks);
      if (currentScreen === 2) renderTasks('buildertrend-list', dashboardData.buildertrendTasks);
      if (currentScreen === 3) renderTasks('sales-list', dashboardData.salesTasks);
      if (currentScreen === 4) renderTasks('marketing-list', dashboardData.marketingTasks);
      // Goals and Projections can be added later if needed
    }

    function switchToScreen(n) {
      currentScreen = n;
      renderCurrentScreen();
    }

    function init() {
      updateClock();
      setInterval(updateClock, 30000);
      fetchData();
      setInterval(fetchData, 10*60*1000);
      // Rotation
      setInterval(() => {
        currentScreen = (currentScreen + 1) % 7;
        renderCurrentScreen();
      }, 30000);
      renderCurrentScreen();
    }

    window.onload = init;
  </script>
</body>
</html>
