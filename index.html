<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Five Development • Daily Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .section-header { font-size: 1.9rem; line-height: 2.2rem; font-weight: 700; letter-spacing: -.04em; }
    .dashboard-screen { transition: opacity 400ms ease; }
    .event-row, .task-row { transition: all 0.2s ease; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen">

  <!-- Top Bar -->
  <div class="border-b border-zinc-800 bg-zinc-900/70 backdrop-blur sticky top-0 z-50">
    <div class="max-w-screen-2xl mx-auto px-8 py-5 flex items-center justify-between">
      <div class="flex items-center gap-x-4">
        <div class="w-11 h-11 bg-white rounded-2xl flex items-center justify-center p-1.5">
          <img src="FD.png" alt="Five Development" class="w-full h-full object-contain">
        </div>
        <div class="font-semibold tracking-tight text-2xl">Five Development</div>
      </div>
      <div id="live-time" class="font-mono text-4xl font-semibold tracking-tighter"></div>
    </div>
  </div>

  <div class="max-w-screen-2xl mx-auto px-8 pt-6 pb-12">
    <div class="flex justify-between items-end mb-6">
      <div>
        <div id="screen-title" class="section-header text-white"></div>
        <div class="text-zinc-500 text-sm">Auto-rotating every 30s • Updates every 10min</div>
      </div>
      <div class="flex gap-2" id="screen-dots"></div>
    </div>

    <!-- Calendar -->
    <div id="screen-0" class="dashboard-screen">
      <div id="calendar-list" class="grid grid-cols-1 gap-3"></div>
    </div>
    <!-- My Tasks -->
    <div id="screen-1" class="dashboard-screen hidden">
      <div id="mytasks-list" class="grid grid-cols-1 gap-3"></div>
    </div>
    <!-- BuilderTrend -->
    <div id="screen-2" class="dashboard-screen hidden">
      <div id="buildertrend-list" class="grid grid-cols-1 gap-3"></div>
    </div>
    <!-- Sales Tasks -->
    <div id="screen-3" class="dashboard-screen hidden">
      <div id="sales-list" class="grid grid-cols-1 gap-3"></div>
    </div>
    <!-- Marketing Tasks -->
    <div id="screen-4" class="dashboard-screen hidden">
      <div id="marketing-list" class="grid grid-cols-1 gap-3"></div>
    </div>
    <!-- Goals & Projections (simplified for now) -->
    <div id="screen-5" class="dashboard-screen hidden">
      <div class="text-center text-zinc-400 py-20">Goals Screen</div>
    </div>
    <div id="screen-6" class="dashboard-screen hidden">
      <div class="text-center text-zinc-400 py-20">Projections Screen</div>
    </div>
  </div>

  <script>
    const WEBHOOK_URL = "https://fivedevelopment.app.n8n.cloud/webhook/dashboard-data";
    let currentScreen = 0;
    let dashboardData = {
      calendarEvents: [], myTasks: [], buildertrendTasks: [], salesTasks: [], marketingTasks: []
    };

    function updateClock() {
      const now = new Date();
      document.getElementById('live-time').textContent = now.toLocaleTimeString('en-US', {
        timeZone: 'America/Chicago', hour: 'numeric', minute: '2-digit', hour12: true
      });
    }

    function fetchData() {
      fetch(WEBHOOK_URL)
        .then(r => r.json())
        .then(raw => {
          // Robust unwrapping for n8n wrapper format
          dashboardData.calendarEvents = raw.calendarEvents?.data || raw.calendarEvents || [];
          dashboardData.myTasks = raw.myTasks?.data || raw.myTasks || [];
          dashboardData.buildertrendTasks = raw.buildertrendTasks?.data || raw.buildertrendTasks || [];
          dashboardData.salesTasks = raw.salesTasks?.data || raw.salesTasks || [];
          dashboardData.marketingTasks = raw.marketingTasks?.data || raw.marketingTasks || [];
          renderCurrentScreen();
        })
        .catch(err => console.error("Fetch error", err));
    }

    function renderCalendar() {
      const container = document.getElementById('calendar-list');
      container.innerHTML = '';
      const events = dashboardData.calendarEvents || [];
      if (events.length === 0) {
        container.innerHTML = `<div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-8 text-center text-zinc-400">No events scheduled</div>`;
        return;
      }
      events.forEach(event => {
        const div = document.createElement('div');
        div.className = 'event-row bg-zinc-900 border border-zinc-800 rounded-3xl px-7 py-5 flex items-center gap-x-5';
        div.innerHTML = `
          <div class="flex-1 font-semibold text-2xl tracking-tight">${event.title || 'No title'}</div>
          <div class="font-mono text-lg text-zinc-400">${event.timeframe || 'All day'}</div>
        `;
        container.appendChild(div);
      });
    }

    function renderTasks(listId, tasks) {
      const container = document.getElementById(listId);
      container.innerHTML = '';
      if (!tasks || tasks.length === 0) {
        container.innerHTML = `<div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-8 text-center text-emerald-400">All caught up — nice work</div>`;
        return;
      }
      tasks.forEach(task => {
        const div = document.createElement('div');
        div.className = 'task-row bg-zinc-900 border border-zinc-800 rounded-3xl px-7 py-5 flex justify-between items-center';
        div.innerHTML = `
          <div class="font-semibold text-2xl tracking-tight">${task.title || 'No title'}</div>
          <div class="text-sm font-medium">${task.dueLabel || ''}</div>
        `;
        container.appendChild(div);
      });
    }

    function renderCurrentScreen() {
      document.querySelectorAll('.dashboard-screen').forEach(s => s.classList.add('hidden'));
      document.getElementById(`screen-${currentScreen}`).classList.remove('hidden');

      const titles = ['Calendar', 'My Tasks', 'BuilderTrend Tasks', 'Sales Tasks', 'Marketing Tasks', 'Goals', 'Projections'];
      document.getElementById('screen-title').textContent = titles[currentScreen];

      if (currentScreen === 0) renderCalendar();
      if (currentScreen === 1) renderTasks('mytasks-list', dashboardData.myTasks);
      if (currentScreen === 2) renderTasks('buildertrend-list', dashboardData.buildertrendTasks);
      if (currentScreen === 3) renderTasks('sales-list', dashboardData.salesTasks);
      if (currentScreen === 4) renderTasks('marketing-list', dashboardData.marketingTasks);
    }

    function switchToScreen(n) {
      currentScreen = n;
      renderCurrentScreen();
    }

    function init() {
      updateClock();
      setInterval(updateClock, 30000);
      fetchData();
      setInterval(fetchData, 600000); // 10 minutes

      // Auto-rotate
      setInterval(() => {
        currentScreen = (currentScreen + 1) % 7;
        renderCurrentScreen();
      }, 30000);

      renderCurrentScreen();
    }

    window.onload = init;
  </script>
</body>
</html>
