<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Five Development • Daily Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .section-header { font-size: 2.1rem; line-height: 2.4rem; font-weight: 700; letter-spacing: -.04em; }
    .dashboard-screen { transition: opacity 400ms ease, transform 400ms ease; }
    .event-row, .task-row { transition: all 0.2s ease; }

    /* 1. ANTI-BURN ANIMATED LIQUID BACKGROUND */
    @keyframes fluidBg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .moving-ambient-bg {
      background: linear-gradient(-45deg, #050507, #0c0c12, #020617, #09090f);
      background-size: 400% 400%;
      animation: fluidBg 25s ease infinite;
    }

    /* 2. MICRO-PIXEL SHIFTER (Protects the static top bar elements from ghosting) */
    @keyframes pixelShift {
      0%, 100% { transform: translate(0px, 0px); }
      25% { transform: translate(1px, 1px); }
      50% { transform: translate(-1px, 0px); }
      75% { transform: translate(0px, -1px); }
    }
    .burn-protected-header {
      animation: pixelShift 60s linear infinite;
    }
  </style>
</head>
<body class="moving-ambient-bg text-zinc-200 min-h-screen">
  
  <div class="border-b border-zinc-900/60 bg-zinc-950/40 backdrop-blur sticky top-0 z-50 burn-protected-header">
    <div class="max-w-screen-2xl mx-auto px-8 py-5 flex items-center justify-between">
      <div class="flex items-center gap-x-4">
        <div class="flex items-center gap-x-3">
          <div class="w-11 h-11 bg-zinc-200 rounded-2xl flex items-center justify-center p-1.5 shadow-inner opacity-90">
            <img src="FD.png" alt="Five Development Logo" class="w-full h-full object-contain">
          </div>
          <div>
            <div class="font-semibold tracking-tight text-2xl text-zinc-300">Five Development</div>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-x-8">
        <div class="text-right">
          <div id="live-time" class="font-mono text-4xl font-semibold tracking-tighter text-zinc-300"></div>
          <div id="live-date" class="text-xs text-zinc-500 tracking-[1px] uppercase mt-0.5"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="max-w-screen-2xl mx-auto px-8 pt-6 pb-12">
    <div class="flex items-end justify-between mb-8">
      <div>
        <div id="screen-title" class="section-header text-zinc-100"></div>
        <div class="text-zinc-500 text-sm mt-1 flex items-center gap-x-2">
          <i class="fa-solid fa-sync fa-sm"></i>
          <span>Auto-rotating every 30 seconds • Updates every 10 minutes</span>
        </div>
      </div>
      <div class="flex items-center gap-x-2" id="screen-dots">
        <div onclick="switchToScreen(0)" class="w-3 h-3 rounded-full bg-white cursor-pointer transition-all" data-screen="0"></div>
        <div onclick="switchToScreen(1)" class="w-3 h-3 rounded-full bg-zinc-700 hover:bg-zinc-600 cursor-pointer transition-all" data-screen="1"></div>
        <div onclick="switchToScreen(2)" class="w-3 h-3 rounded-full bg-zinc-700 hover:bg-zinc-600 cursor-pointer transition-all" data-screen="2"></div>
      </div>
    </div>

    <div id="screen-0" class="dashboard-screen">
      <div class="grid grid-cols-1 gap-4" id="calendar-list"></div>
    </div>

    <div id="screen-1" class="dashboard-screen hidden">
      <div class="grid grid-cols-1 gap-4" id="mytasks-list"></div>
    </div>

    <div id="screen-2" class="dashboard-screen hidden">
      <div class="grid grid-cols-1 gap-4" id="buildertrend-list"></div>
    </div>
  </div>

  <script>
    const WEBHOOK_URL = "https://fivedevelopment.app.n8n.cloud/webhook/dashboard-data";

    let currentScreen = 0;
    let rotationInterval = null;
    let dataRefreshInterval = null;
    let dashboardData = { calendarEvents: [], myTasks: [], buildertrendTasks: [] };

    function updateClock() {
      const now = new Date();
      document.getElementById('live-time').textContent = now.toLocaleTimeString('en-US', {
        timeZone: 'America/Chicago', hour: 'numeric', minute: '2-digit', hour12: true
      });
      document.getElementById('live-date').textContent = now.toLocaleDateString('en-US', {
        timeZone: 'America/Chicago', weekday: 'long', month: 'long', day: 'numeric'
      });
    }

    function ensureArrays() {
      if (!Array.isArray(dashboardData.calendarEvents)) {
        dashboardData.calendarEvents = dashboardData.calendarEvents ? [dashboardData.calendarEvents] : [];
      }
      if (!Array.isArray(dashboardData.myTasks)) {
        dashboardData.myTasks = dashboardData.myTasks ? [dashboardData.myTasks] : [];
      }
      if (!Array.isArray(dashboardData.buildertrendTasks)) {
        dashboardData.buildertrendTasks = dashboardData.buildertrendTasks ? [dashboardData.buildertrendTasks] : [];
      }
    }

    async function fetchData() {
      try {
        const res = await fetch(WEBHOOK_URL);
        if (!res.ok) throw new Error('HTTP error');
        const raw = await res.json();
        dashboardData = {
          calendarEvents: raw.calendarEvents || [],
          myTasks: raw.myTasks || [],
          buildertrendTasks: raw.buildertrendTasks || [],
          lastUpdated: raw.lastUpdated || new Date().toISOString()
        };
        ensureArrays();
        console.log("Data loaded successfully");
      } catch (err) {
        console.error("Failed to load data:", err);
        ensureArrays();
      }
      renderCurrentScreen();
    }

    function renderCalendar() {
      ensureArrays();
      const container = document.getElementById('calendar-list');
      container.innerHTML = '';
      const events = dashboardData.calendarEvents;
      
      if (events.length === 0) {
        container.innerHTML = `<div class="bg-zinc-900/40 border border-zinc-800/60 rounded-3xl p-8 text-center"><i class="fa-regular fa-calendar text-4xl text-zinc-700 mb-4"></i><div class="text-xl text-zinc-400">No events scheduled</div></div>`;
        return;
      }
      
      const colorMap = {'1':'#6366f1','2':'#22c55e','3':'#a855f7','4':'#f43f5e','5':'#eab308','6':'#f97316','7':'#0ea5e9','8':'#64748b','9':'#3b82f6','10':'#10b981','11':'#ef4444'};
      
      events.forEach(event => {
        const accent = colorMap[event.colorId] || '#3b82f6';
        const div = document.createElement('div');
        
        div.className = `event-row border border-zinc-800/40 rounded-2xl p-5 flex items-center gap-x-5 transition-all shadow-lg`;
        div.style.background = `linear-gradient(90deg, ${accent}12 0%, rgba(18,18,24,0.75) 100%)`;
        div.style.borderLeft = `6px solid ${accent}`;
        
        div.innerHTML = `
          <div class="flex-1 min-w-0">
            <div class="font-bold text-2xl tracking-tight text-zinc-100 mb-2">${event.title}</div>
            <div class="text-sm font-medium text-zinc-400 flex items-center gap-x-2">
              <i class="fa-regular fa-clock opacity-80 text-xl" style="color:${accent}"></i>
              <span class="font-mono text-base tracking-tight">${event.timeframe}</span>
            </div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function renderTasks(listId, tasksInput) {
      ensureArrays();
      const container = document.getElementById(listId);
      container.innerHTML = '';
      const tasks = tasksInput || [];
      
      if (tasks.length === 0) {
        container.innerHTML = `<div class="bg-zinc-900/40 border border-zinc-800/60 rounded-3xl p-8 text-center"><i class="fa-regular fa-check-circle text-4xl text-emerald-700 mb-4"></i><div class="text-xl text-zinc-400">All caught up — nice work</div></div>`;
        return;
      }
      
      tasks.forEach(task => {
        const div = document.createElement('div');
        div.className = `task-row bg-zinc-900/40 border border-zinc-800/50 rounded-2xl px-6 py-5 flex items-center justify-between gap-x-4 transition-all shadow-md backdrop-blur-sm`;
        
        let dueHTML = '';
        const labelText = (task.dueLabel || '').trim().toLowerCase();
        
        if (labelText === 'past due' || task.isPastDue) {
          dueHTML = `<span class="px-3.5 py-1 text-xs font-bold tracking-wider rounded-full bg-red-500/10 text-red-400 border border-red-500/20 flex items-center gap-1.5"><i class="fa-solid fa-circle-exclamation text-xs"></i> PAST DUE</span>`;
        } else if (labelText === 'today') {
          dueHTML = `<span class="px-3.5 py-1 text-xs font-bold tracking-wider rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-1.5"><i class="fa-solid fa-calendar-day text-xs"></i> TODAY</span>`;
        } else if (labelText === 'no due date') {
          dueHTML = `<span class="px-3.5 py-1 text-xs font-medium tracking-wider rounded-full bg-zinc-800/80 text-zinc-500 border border-zinc-700/50 flex items-center gap-1.5"><i class="fa-regular fa-calendar-minus text-xs"></i> NO DUE DATE</span>`;
        } else {
          dueHTML = `<span class="px-3.5 py-1 text-xs font-semibold tracking-wider rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 flex items-center gap-1.5"><i class="fa-regular fa-calendar text-xs"></i> ${task.dueLabel}</span>`;
        }
        
        div.innerHTML = `
          <div class="flex items-center gap-x-4 flex-1 min-w-0">
            <div class="w-6 h-6 rounded-full border-2 border-zinc-700 flex-shrink-0 flex items-center justify-center">
              <div class="w-2 h-2 rounded-full bg-zinc-800"></div>
            </div>
            <div class="flex-1 min-w-0">
              <div class="font-semibold text-2xl tracking-tight text-zinc-200">${task.title}</div>
            </div>
          </div>
          <div class="flex-shrink-0">${dueHTML}</div>
        `;
        container.appendChild(div);
      });
    }

    function renderCurrentScreen() {
      ensureArrays();
      document.querySelectorAll('.dashboard-screen').forEach(el => el.classList.add('hidden'));
      document.getElementById(`screen-${currentScreen}`).classList.remove('hidden');
      const titles = ['Calendar', 'My Tasks', 'BuilderTrend Tasks'];
      document.getElementById('screen-title').textContent = titles[currentScreen];
      
      document.querySelectorAll('#screen-dots > div').forEach((dot, idx) => {
        if (idx === currentScreen) {
          dot.className = "w-3 h-3 rounded-full bg-zinc-300 cursor-pointer transition-all";
        } else {
          dot.className = "w-3 h-3 rounded-full bg-zinc-800 hover:bg-zinc-700 cursor-pointer transition-all";
        }
      });

      if (currentScreen === 0) renderCalendar();
      if (currentScreen === 1) renderTasks('mytasks-list', dashboardData.myTasks);
      if (currentScreen === 2) renderTasks('buildertrend-list', dashboardData.buildertrendTasks);
    }

    function switchToScreen(index) {
      currentScreen = index;
      renderCurrentScreen();
    }

    function startRotation() {
      if (rotationInterval) clearInterval(rotationInterval);
      rotationInterval = setInterval(() => {
        currentScreen = (currentScreen + 1) % 3;
        renderCurrentScreen();
      }, 30000);
    }

    function startAutoRefresh() {
      if (dataRefreshInterval) clearInterval(dataRefreshInterval);
      dataRefreshInterval = setInterval(fetchData, 10 * 60 * 1000);
    }

    async function initDashboard() {
      updateClock();
      setInterval(updateClock, 30000);
      renderCurrentScreen();
      await fetchData();
      startRotation();
      startAutoRefresh();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { currentScreen = (currentScreen + 1) % 3; renderCurrentScreen(); }
      if (e.key === 'ArrowLeft') { currentScreen = (currentScreen - 1 + 3) % 3; renderCurrentScreen(); }
    });

    window.onload = initDashboard;
  </script>
</body>
</html>
