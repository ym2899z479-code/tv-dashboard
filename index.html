<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Five Development • Daily Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link class="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .section-header { font-size: 1.8rem; line-height: 2.1rem; font-weight: 700; letter-spacing: -.04em; }
    .dashboard-screen { transition: opacity 400ms ease, transform 400ms ease; }
    .event-row, .task-row, .goal-card, .projection-card { transition: all 0.2s ease; }

    /* ANTI-BURN ANIMATED LIQUID BACKGROUND */
    @keyframes fluidBg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .moving-ambient-bg {
      background: linear-gradient(-45deg, #050507, #0c0c12, #020617, #09090f);
      background-size: 400% 400%;
      animation: fluidBg 25s ease infinite;
    }

    /* MICRO-PIXEL SHIFTER */
    @keyframes pixelShift {
      0%, 100% { transform: translate(0px, 0px); }
      25% { transform: translate(1px, 1px); }
      50% { transform: translate(-1px, 0px); }
      75% { transform: translate(0px, -1px); }
    }
    .burn-protected-header {
      animation: pixelShift 60s linear infinite;
    }
  </style>
</head>
<body class="moving-ambient-bg text-zinc-200 min-h-screen">
  
  <!-- Top Bar -->
  <div class="border-b border-zinc-900/60 bg-zinc-950/40 backdrop-blur sticky top-0 z-50 burn-protected-header">
    <div class="max-w-screen-2xl mx-auto px-8 py-3 flex items-center justify-between">
      <div class="flex items-center gap-x-4">
        <div class="flex items-center gap-x-3">
          <div class="w-9 h-9 bg-zinc-200 rounded-xl flex items-center justify-center p-1 shadow-inner opacity-90">
            <img src="FD.png" alt="Five Development Logo" class="w-full h-full object-contain">
          </div>
          <div>
            <div class="font-semibold tracking-tight text-xl text-zinc-300">Five Development</div>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-x-8">
        <div class="text-right">
          <div id="live-time" class="text-2xl font-bold tracking-tight text-zinc-300"></div>
          <div id="live-date" class="text-[10px] font-medium text-zinc-500 tracking-[1px] uppercase mt-0.5"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="max-w-screen-2xl mx-auto px-8 pt-4 pb-6">
    <div id="title-area" class="flex items-end justify-between mb-4 burn-protected-header">
      <div>
        <div id="screen-title" class="section-header text-zinc-100"></div>
        <div class="text-zinc-500 text-xs mt-0.5 flex items-center gap-x-2">
          <i class="fa-solid fa-sync fa-sm"></i>
          <span>Auto-rotating every 30 seconds • Updates every 10 minutes</span>
        </div>
      </div>
      <div class="flex items-center gap-x-2" id="screen-dots">
        <div onclick="switchToScreen(0)" class="w-2.5 h-2.5 rounded-full bg-zinc-300 cursor-pointer transition-all" data-screen="0"></div>
        <div onclick="switchToScreen(1)" class="w-2.5 h-2.5 rounded-full bg-zinc-800 hover:bg-zinc-700 cursor-pointer transition-all" data-screen="1"></div>
        <div onclick="switchToScreen(2)" class="w-2.5 h-2.5 rounded-full bg-zinc-800 hover:bg-zinc-700 cursor-pointer transition-all" data-screen="2"></div>
        <div onclick="switchToScreen(3)" class="w-2.5 h-2.5 rounded-full bg-zinc-800 hover:bg-zinc-700 cursor-pointer transition-all" data-screen="3"></div>
        <div onclick="switchToScreen(4)" class="w-2.5 h-2.5 rounded-full bg-zinc-800 hover:bg-zinc-700 cursor-pointer transition-all" data-screen="4"></div>
      </div>
    </div>

    <!-- SCREEN 1: Calendar -->
    <div id="screen-0" class="dashboard-screen">
      <div class="grid grid-cols-1 gap-2.5" id="calendar-list"></div>
    </div>

    <!-- SCREEN 2: My Tasks -->
    <div id="screen-1" class="dashboard-screen hidden">
      <div class="grid grid-cols-1 gap-2.5" id="mytasks-list"></div>
    </div>

    <!-- SCREEN 3: BuilderTrend Tasks -->
    <div id="screen-2" class="dashboard-screen hidden">
      <div class="grid grid-cols-1 gap-2.5" id="buildertrend-list"></div>
    </div>

    <!-- SCREEN 4: Goals Layout -->
    <div id="screen-3" class="dashboard-screen hidden">
      <div class="grid grid-cols-[140px_1fr_1fr] gap-x-5 gap-y-2 items-center" id="goals-matrix-container"></div>
    </div>

    <!-- SCREEN 5: Projections Layout -->
    <div id="screen-4" class="dashboard-screen hidden flex flex-col gap-y-4">
      <!-- Top 3 Vertical Columns Layout -->
      <div class="grid grid-cols-3 gap-5">
        <!-- Active Column (Left) -->
        <div>
          <div class="text-blue-400 font-bold text-xl tracking-wide uppercase border-b border-zinc-900/80 pb-1.5 mb-2.5"><i class="fa-solid fa-bolt fa-sm mr-2"></i>Active Jobs</div>
          <div class="grid grid-cols-1 gap-2" id="projections-active-list"></div>
        </div>
        <!-- Pipeline Prospect Column (Middle) -->
        <div>
          <div class="text-zinc-400 font-bold text-xl tracking-wide uppercase border-b border-zinc-900/80 pb-1.5 mb-2.5"><i class="fa-solid fa-gavel fa-sm mr-2"></i>Pipeline Prospect</div>
          <div class="grid grid-cols-1 gap-2" id="projections-pipe-list"></div>
        </div>
        <!-- Leads & Inquiries Column (Right) -->
        <div>
          <div class="text-emerald-400 font-bold text-xl tracking-wide uppercase border-b border-zinc-900/80 pb-1.5 mb-2.5"><i class="fa-solid fa-address-book fa-sm mr-2"></i>Leads & Inquiries</div>
          <div class="grid grid-cols-1 gap-2" id="projections-leads-list"></div>
        </div>
      </div>

      <!-- Preparation Column (Bottom Full-Width Row Grid) -->
      <div class="mt-1">
        <div class="text-amber-500/90 font-bold text-xl tracking-wide uppercase border-b border-zinc-900/80 pb-1.5 mb-2.5"><i class="fa-solid fa-sliders fa-sm mr-2"></i>Preparation</div>
        <div class="grid grid-cols-4 gap-3" id="projections-prep-list"></div>
      </div>
    </div>
  </div>

  <script>
    var WEBHOOK_URL = "https://fivedevelopment.app.n8n.cloud/webhook/dashboard-data";

    var currentScreen = 0;
    var rotationInterval = null;
    var dataRefreshInterval = null;
    var dashboardData = { 
      calendarEvents: [], 
      myTasks: [], 
      buildertrendTasks: [], 
      goals: { month: [], quarter: [], monthRevenue: '—', quarterRevenue: '—' },
      projections: { months: [], active: [], preparation: [], pipeline: [], leads: [] }
    };

    function updateClock() {
      var now = new Date();
      var timeStr = "";
      var dateStr = "";
      
      try {
        timeStr = now.toLocaleTimeString('en-US', {
          timeZone: 'America/Chicago', hour: 'numeric', minute: '2-digit', hour12: true
        });
        dateStr = now.toLocaleDateString('en-US', {
          timeZone: 'America/Chicago', weekday: 'long', month: 'long', day: 'numeric'
        });
      } catch(e) {
        var hours = now.getHours();
        var minutes = now.getMinutes();
        var ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        minutes = minutes < 10 ? '0' + minutes : minutes;
        timeStr = hours + ':' + minutes + ' ' + ampm;
        dateStr = now.toDateString();
      }
      
      document.getElementById('live-time').textContent = timeStr;
      document.getElementById('live-date').textContent = dateStr;
    }

    function formatCurrency(val) {
      if (val === undefined || val === null || val === '—') return '—';
      var cleanNum = parseFloat(val.toString().replace(/[^0-9.]/g, ''));
      if (isNaN(cleanNum)) return val; 
      return '$' + cleanNum.toLocaleString('en-US', { maximumFractionDigits: 0 });
    }

    function fetchData() {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", WEBHOOK_URL, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              var raw = JSON.parse(xhr.responseText);
              dashboardData.calendarEvents = raw.calendarEvents || [];
              dashboardData.myTasks = raw.myTasks || [];
              dashboardData.buildertrendTasks = raw.buildertrendTasks || [];
              dashboardData.goals = raw.goals || { month: [], quarter: [], monthRevenue: '—', quarterRevenue: '—' };
              dashboardData.projections = raw.projections || { months: [], active: [], preparation: [], pipeline: [], leads: [] };
            } catch(e) {
              console.error("Data parse failure:", e);
            }
          }
          renderCurrentScreen();
        }
      };
      xhr.send();
    }

    function renderCalendar() {
      var container = document.getElementById('calendar-list');
      if (!container) return;
      container.innerHTML = '';
      var events = dashboardData.calendarEvents || [];
      
      if (events.length === 0) {
        container.innerHTML = '<div class="bg-zinc-900/40 border border-zinc-800/60 rounded-2xl p-6 text-center"><i class="fa-regular fa-calendar text-3xl text-zinc-700 mb-3"></i><div class="text-lg text-zinc-400">No events scheduled</div></div>';
        return;
      }
      
      var colorMap = {'1':'#6366f1','2':'#22c55e','3':'#a855f7','4':'#f43f5e','5':'#eab308','6':'#f97316','7':'#0ea5e9','8':'#64748b','9':'#3b82f6','10':'#10b981','11':'#ef4444'};
      
      for (var i = 0; i < events.length; i++) {
        var event = events[i];
        var accent = colorMap[event.colorId] || '#3b82f6';
        var div = document.createElement('div');
        div.className = 'event-row border border-zinc-800/40 rounded-xl py-3.5 px-5 flex items-center gap-x-4 transition-all shadow-md';
        div.style.background = 'linear-gradient(90deg, ' + accent + '12 0%, rgba(18,18,24,0.75) 100%)';
        div.style.borderLeft = '5px solid ' + accent;
        
        div.innerHTML = '<div class="flex-1 min-w-0 flex items-center justify-between gap-x-4">' +
            '<div class="font-bold text-xl tracking-tight text-zinc-100 truncate">' + event.title + '</div>' +
            '<div class="text-xs font-semibold text-zinc-400 flex items-center gap-x-1.5 flex-shrink-0">' +
              '<i class="fa-regular fa-clock opacity-80 text-sm" style="color:' + accent + '"></i>' +
              '<span class="tracking-tight text-sm font-semibold">' + event.timeframe + '</span>' +
            '</div>' +
          '</div>';
        container.appendChild(div);
      }
    }

    function renderTasks(listId, tasksInput) {
      var container = document.getElementById(listId);
      if (!container) return;
      container.innerHTML = '';
      var tasks = tasksInput || [];
      
      if (tasks.length === 0) {
        container.innerHTML = '<div class="bg-zinc-900/40 border border-zinc-800/60 rounded-2xl p-6 text-center"><i class="fa-regular fa-check-circle text-3xl text-emerald-700 mb-3"></i><div class="text-lg text-zinc-400">All caught up — nice work</div></div>';
        return;
      }
      
      for (var i = 0; i < tasks.length; i++) {
        var task = tasks[i];
        var div = document.createElement('div');
        div.className = 'task-row bg-zinc-900/40 border border-zinc-800/50 rounded-xl px-5 py-3.5 flex items-center justify-between gap-x-4 transition-all shadow-sm backdrop-blur-sm';
        
        var dueHTML = '';
        var labelText = (task.dueLabel || '').trim().toLowerCase();
        
        if (labelText === 'past due' || task.isPastDue) {
          dueHTML = '<span class="px-2.5 py-0.5 text-[10px] font-bold tracking-wider rounded-full bg-red-500/10 text-red-400 border border-red-500/20 flex items-center gap-1"><i class="fa-solid fa-circle-exclamation text-[10px]"></i> PAST DUE</span>';
        } else if (labelText === 'today') {
          dueHTML = '<span class="px-2.5 py-0.5 text-[10px] font-bold tracking-wider rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-1"><i class="fa-solid fa-calendar-day text-[10px]"></i> TODAY</span>';
        } else if (labelText === 'no due date') {
          dueHTML = '<span class="px-2.5 py-0.5 text-[10px] font-bold tracking-wider rounded-full bg-zinc-800/80 text-zinc-500 border border-zinc-700/50 flex items-center gap-1"><i class="fa-regular fa-calendar-minus text-[10px]"></i> NO DUE DATE</span>';
        } else {
          dueHTML = '<span class="px-2.5 py-0.5 text-[10px] font-bold tracking-wider rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 flex items-center gap-1"><i class="fa-regular fa-calendar text-[10px]"></i> ' + task.dueLabel + '</span>';
        }
        
        div.innerHTML = '<div class="flex items-center gap-x-3 flex-1 min-w-0">' +
            '<div class="w-5 h-5 rounded-full border-2 border-zinc-700 flex-shrink-0 flex items-center justify-center">' +
              '<div class="w-1.5 h-1.5 rounded-full bg-zinc-800"></div>' +
            '</div>' +
            '<div class="flex-1 min-w-0">' +
              '<div class="font-semibold text-xl tracking-tight text-zinc-200 truncate">' + task.title + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="flex-shrink-0">' + dueHTML + '</div>';
        container.appendChild(div);
      }
    }

    function renderGoals() {
      var now = new Date();
      var monthStr = "";
      try {
        monthStr = now.toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'America/Chicago' });
      } catch(e) {
        monthStr = "Current Month";
      }
      
      var quarterNum = Math.floor((now.getMonth() + 3) / 3);
      var suffixes = ["th", "st", "nd", "rd", "th"];
      var quarterStr = quarterNum + suffixes[quarterNum] + " Quarter";

      var matrix = document.getElementById('goals-matrix-container');
      if (!matrix) return;
      
      matrix.innerHTML = '<div></div>' +
        '<div class="text-zinc-300 font-bold text-xl tracking-wide text-center border-b border-zinc-800/80 pb-1">' + monthStr + '</div>' +
        '<div class="text-zinc-300 font-bold text-xl tracking-wide text-center border-b border-zinc-800/80 pb-1">' + quarterStr + '</div>';

      var goalsData = dashboardData.goals || { month: [], quarter: [], monthRevenue: '—', quarterRevenue: '—' };

      for (var i = 0; i < 3; i++) {
        var mText = (goalsData.month && goalsData.month[i]) || '—';
        var qText = (goalsData.quarter && goalsData.quarter[i]) || '—';

        var lbl = document.createElement('div');
        lbl.className = "text-zinc-400 text-sm font-bold uppercase tracking-wide text-center h-full flex items-center justify-center";
        lbl.textContent = 'Goal ' + (i + 1) + ':';
        matrix.appendChild(lbl);

        var mCell = document.createElement('div');
        mCell.className = "goal-card bg-zinc-900/40 border border-zinc-800/50 rounded-xl p-1.5 min-h-[38px] flex items-center justify-center text-center shadow-md backdrop-blur-sm";
        mCell.innerHTML = '<div class="text-zinc-200 text-sm font-semibold tracking-tight leading-tight">' + mText + '</div>';
        matrix.appendChild(mCell);

        var qCell = document.createElement('div');
        qCell.className = "goal-card bg-zinc-900/40 border border-zinc-800/50 rounded-xl p-1.5 min-h-[38px] flex items-center justify-center text-center shadow-md backdrop-blur-sm";
        qCell.innerHTML = '<div class="text-zinc-200 text-sm font-semibold tracking-tight leading-tight">' + qText + '</div>';
        matrix.appendChild(qCell);
      }

      var revLabel = document.createElement('div');
      revLabel.className = "text-emerald-400 text-sm font-bold uppercase tracking-wide text-center h-full flex items-center justify-center mt-1";
      revLabel.innerHTML = '<i class="fa-solid fa-chart-line mr-1"></i> Revenue:';
      matrix.appendChild(revLabel);

      var mRevCell = document.createElement('div');
      mRevCell.className = "goal-card border border-emerald-900/30 rounded-xl p-1.5 flex items-center justify-center text-center shadow-md backdrop-blur-sm mt-1";
      mRevCell.style.background = 'linear-gradient(90deg, rgba(16,185,129,0.04) 0%, rgba(0,0,0,0) 100%)';
      mRevCell.innerHTML = '<span class="text-[10px] font-bold text-emerald-500/60 uppercase tracking-widest mr-1.5">Month:</span>' +
        '<span class="text-emerald-400 text-base font-bold tracking-tight">' + formatCurrency(goalsData.monthRevenue) + '</span>';
      matrix.appendChild(mRevCell);

      var qRevCell = document.createElement('div');
      qRevCell.className = "goal-card border border-emerald-900/30 rounded-xl p-1.5 flex items-center justify-center text-center shadow-md backdrop-blur-sm mt-1";
      qRevCell.style.background = 'linear-gradient(90deg, rgba(16,185,129,0.04) 0%, rgba(0,0,0,0) 100%)';
      qRevCell.innerHTML = '<span class="text-[10px] font-bold text-emerald-500/60 uppercase tracking-widest mr-1.5">Quarter:</span>' +
        '<span class="text-emerald-400 text-base font-bold tracking-tight">' + formatCurrency(goalsData.quarterRevenue) + '</span>';
      matrix.appendChild(qRevCell);
    }

    function populateProjectionColumn(elementId, items) {
      var container = document.getElementById(elementId);
      if (!container) return;
      container.innerHTML = '';
      
      if (!items || items.length === 0) {
        var spanClass = (elementId === 'projections-prep-list') ? 'col-span-4 ' : '';
        container.innerHTML = '<div class="' + spanClass + 'bg-zinc-900/20 border border-zinc-900/40 border-dashed rounded-xl p-3 text-center text-zinc-600 text-xs font-medium">No tracks active</div>';
        return;
      }

      for (var i = 0; i < items.length; i++) {
        var job = items[i];
        var card = document.createElement('div');
        card.className = 'projection-card bg-zinc-950/40 border border-zinc-900/80 rounded-xl p-1.5 shadow-sm flex flex-col gap-y-0.5 backdrop-blur-sm';
        
        card.innerHTML = 
          '<div class="text-zinc-100 font-bold text-xs tracking-tight truncate border-b border-zinc-900/40 pb-0.5">' + job.address + '</div>' +
          '<div class="grid grid-cols-3 gap-1 text-center mt-0.5">' +
            '<div>' +
              '<div class="text-[8px] font-bold text-zinc-500 uppercase tracking-wider">' + job.m1Label + '</div>' +
              '<div class="text-zinc-300 text-xs font-semibold mt-0.5">' + (job.m1Value > 0 ? formatCurrency(job.m1Value) : '—') + '</div>' +
            '</div>' +
            '<div>' +
              '<div class="text-[8px] font-bold text-zinc-500 uppercase tracking-wider">' + job.m2Label + '</div>' +
              '<div class="text-zinc-300 text-xs font-semibold mt-0.5">' + (job.m2Value > 0 ? formatCurrency(job.m2Value) : '—') + '</div>' +
            '</div>' +
            '<div>' +
              '<div class="text-[8px] font-bold text-zinc-500 uppercase tracking-wider">' + job.m3Label + '</div>' +
              '<div class="text-zinc-300 text-xs font-semibold mt-0.5">' + (job.m3Value > 0 ? formatCurrency(job.m3Value) : '—') + '</div>' +
            '</div>' +
          '</div>';
        container.appendChild(card);
      }
    }

    function renderProjections() {
      var dataset = dashboardData.projections || { active: [], preparation: [], pipeline: [], leads: [] };
      
      // Render columns and rows matching your new blueprint structure
      populateProjectionColumn('projections-active-list', dataset.active);
      populateProjectionColumn('projections-pipe-list', dataset.pipeline);
      populateProjectionColumn('projections-prep-list', dataset.preparation); // Spans full-width bottom row now!
      
      // Render Leads & Inquiries directly into a compact column list on the right
      var leadsContainer = document.getElementById('projections-leads-list');
      if (!leadsContainer) return;
      leadsContainer.innerHTML = '';
      
      var leadsItems = dataset.leads || [];
      if (leadsItems.length === 0) {
        leadsContainer.innerHTML = '<div class="bg-zinc-900/20 border border-zinc-900/40 border-dashed rounded-xl p-3 text-center text-zinc-600 text-xs font-medium">No active pending leads</div>';
        return;
      }
      
      for (var i = 0; i < leadsItems.length; i++) {
        var lead = leadsItems[i];
        var card = document.createElement('div');
        card.className = 'projection-card bg-zinc-950/40 border border-zinc-900/80 rounded-xl p-1.5 shadow-sm flex items-center justify-between gap-x-2 backdrop-blur-sm mb-2';
        
        card.innerHTML = 
          '<div class="text-zinc-200 font-bold text-xs truncate flex-1 min-w-0">' + lead.address + '</div>' +
          '<div class="text-emerald-400 font-bold text-xs flex-shrink-0 tracking-tight">' + (lead.totalValueE > 0 ? formatCurrency(lead.totalValueE) : '—') + '</div>';
        
        leadsContainer.appendChild(card);
      }
    }

    function renderCurrentScreen() {
      var screens = document.querySelectorAll('.dashboard-screen');
      for (var s = 0; s < screens.length; s++) {
        screens[s].classList.add('hidden');
      }
      
      var targetScreen = document.getElementById('screen-' + currentScreen);
      if (targetScreen) targetScreen.classList.remove('hidden');
      
      var titles = ['Calendar', 'My Tasks', 'BuilderTrend Tasks', 'Goals', 'Projections'];
      var titleEl = document.getElementById('screen-title');
      if (titleEl) titleEl.textContent = titles[currentScreen];
      
      var dots = document.querySelectorAll('#screen-dots > div');
      for (var d = 0; d < dots.length; d++) {
        if (d === currentScreen) {
          dots[d].className = "w-2.5 h-2.5 rounded-full bg-zinc-300 cursor-pointer transition-all";
        } else {
          dots[d].className = "w-2.5 h-2.5 rounded-full bg-zinc-800 hover:bg-zinc-700 cursor-pointer transition-all";
        }
      }

      if (currentScreen === 0) renderCalendar();
      if (currentScreen === 1) renderTasks('mytasks-list', dashboardData.myTasks);
      if (currentScreen === 2) renderTasks('buildertrend-list', dashboardData.buildertrendTasks);
      if (currentScreen === 3) renderGoals();
      if (currentScreen === 4) renderProjections();
    }

    function switchToScreen(index) {
      currentScreen = index;
      renderCurrentScreen();
    }

    function startRotation() {
      if (rotationInterval) clearInterval(rotationInterval);
      rotationInterval = setInterval(function() {
        currentScreen = (currentScreen + 1) % 5;
        renderCurrentScreen();
      }, 30000);
    }

    function startAutoRefresh() {
      if (dataRefreshInterval) clearInterval(dataRefreshInterval);
      dataRefreshInterval = setInterval(fetchData, 10 * 60 * 1000);
    }

    function initDashboard() {
      updateClock();
      setInterval(updateClock, 30000);
      renderCurrentScreen();
      fetchData();
      startRotation();
      startAutoRefresh();
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight') { currentScreen = (currentScreen + 1) % 5; renderCurrentScreen(); }
      if (e.key === 'ArrowLeft') { currentScreen = (currentScreen - 1 + 5) % 5; renderCurrentScreen(); }
    });

    window.onload = initDashboard;
  </script>
</body>
</html>
